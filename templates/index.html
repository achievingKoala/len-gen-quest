<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能题目生成器</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 智能题目生成器</h1>
            <p>上传文本，AI自动生成练习题目</p>
        </header>

        <main>
            <!-- 文本上传区域 -->
            <section id="upload-section" class="section">
                <h2>📝 上传学习材料</h2>
                <div class="upload-area">
                    <textarea id="text-input" placeholder="在此粘贴文本内容，或点击下方上传文件..."></textarea>
                    <div class="upload-controls">
                        <div class="question-count-selector">
                            <label for="choice-count">选择题：</label>
                            <select id="choice-count">
                                <option value="1">1题</option>
                                <option value="2">2题</option>
                                <option value="3">3题</option>
                                <option value="4">4题</option>
                                <option value="5" selected>5题</option>
                                <option value="6">6题</option>
                                <option value="7">7题</option>
                                <option value="8">8题</option>
                                <option value="9">9题</option>
                                <option value="10">10题</option>
                            </select>
                            <label for="fill-count">填空题：</label>
                            <select id="fill-count">
                                <option value="1">1题</option>
                                <option value="2" selected>2题</option>
                                <option value="3">3题</option>
                                <option value="4">4题</option>
                                <option value="5">5题</option>
                                <option value="6">6题</option>
                                <option value="7">7题</option>
                                <option value="8">8题</option>
                                <option value="9">9题</option>
                                <option value="10">10题</option>
                            </select>
                        </div>
                        <input type="file" id="file-input" accept=".txt,.md" style="display: none;">
                        <button id="file-btn" class="btn btn-secondary">📁 上传文件</button>
                        <button id="load-questions-btn" class="btn btn-info">题目集管理</button>
                        <button id="generate-btn" class="btn btn-primary">🎯 生成题目</button>
                    </div>
                </div>
            </section>

            <!-- 题目显示区域 -->
            <section id="questions-section" class="section" style="display: none;">
                <h2>📋 练习题目</h2>
                <div id="questions-container"></div>
                <div class="quiz-controls">
                    <button id="select-all-btn" class="btn btn-secondary">全选</button>
                    <button id="save-selected-btn" class="btn btn-info">保存选中</button>
                    <span id="selected-count" style="margin-left: 10px; color: #666;"></span>
                    <button id="submit-quiz" class="btn btn-success">提交答案</button>
                    <button id="reset-quiz" class="btn btn-secondary">重新开始</button>
                </div>
            </section>

            <!-- 结果显示区域 -->
            <section id="results-section" class="section" style="display: none;">
                <h2>📊 答题结果</h2>
                <div id="results-container"></div>
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
